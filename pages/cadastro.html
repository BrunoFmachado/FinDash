<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinDash — Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">F</div>
      <div class="brand-text">
        <strong>FinDash</strong>
        <span>controle financeiro</span>
      </div>
    </div>

    <h1>Criar conta</h1>
    <p class="subtitle">Preencha os dados para se cadastrar</p>

    <form id="formCadastro">
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required>
      </div>

      <button type="submit" class="btn-primary">Criar conta</button>
      <p id="mensagem"></p>
    </form>

    <div class="divider">ou</div>

    <p class="login-link">
      Já tem uma conta? <a href="../index.html">Fazer login</a>
    </p>
  </div>

  <script>
    document.getElementById("formCadastro").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;
      const msg = document.getElementById("mensagem");

      if (senha !== confirmarSenha) {
        msg.textContent = "As senhas não coincidem.";
        msg.className = "erro";
        return;
      }

      if (senha.length < 6) {
        msg.textContent = "A senha deve ter no mínimo 6 caracteres.";
        msg.className = "erro";
        return;
      }

      try {
        const resposta = await fetch("http://localhost:3000/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, email, senha })
        });

        const dados = await resposta.json();

        if (resposta.ok) {
          msg.textContent = "Conta criada com sucesso! Redirecionando...";
          msg.className = "sucesso";
          setTimeout(() => {
            window.location.href = "../index.html";
          }, 1500);
        } else {
          msg.textContent = dados.mensagem || "Erro ao criar conta.";
          msg.className = "erro";
        }
      } catch (err) {
        msg.textContent = "Erro de conexão com o servidor.";
        msg.className = "erro";
      }
    });
  </script>

</body>
</html>
